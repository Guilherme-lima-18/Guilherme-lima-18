name: Build README

# O README.md e os SVGs sao gerados a partir de readme.source.md.
# Como os blocos de estatisticas embutem dados vivos do GitHub (commits,
# repos, distribuicao de linguagens), este workflow rebuilda e commita o
# resultado sozinho: diariamente para manter os numeros frescos, e a cada
# push que altere a fonte.
#
# Ele NAO roda em pull_request de forks (nao teria permissao de escrita).

on:
  push:
    branches: [main]
    paths:
      - 'readme.source.md'
      - '.github/img/**'
      - '.github/workflows/readme-aura.yml'
  schedule:
    # 06:00 UTC = 03:00 em Sao Paulo
    - cron: '0 6 * * *'
  workflow_dispatch:

# Necessario para commitar o README regenerado de volta no repositorio.
permissions:
  contents: write

# Evita duas execucoes commitando ao mesmo tempo.
concurrency:
  group: readme-aura
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Rebuild README from source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes readme-aura@1.0.19 build \
            --source readme.source.md \
            --output README.md \
            --assets .github/assets \
            --github-user Guilherme-lima-18

      - name: Commit the regenerated README
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada mudou: README ja esta em dia."
            exit 0
          fi

          echo "Arquivos alterados:"
          git status --porcelain

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atualiza os graficos do README com os dados do GitHub"
          git push
